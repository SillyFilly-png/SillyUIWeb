<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudNode Admin v5</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --blue: #58a6ff; --green: #238636; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .admin-badge { font-size: 10px; background: var(--green); color: white; padding: 3px 10px; border-radius: 12px; display: none; font-weight: bold; }

        .file-list { display: grid; gap: 12px; }
        .file-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .file-info { display: flex; justify-content: space-between; align-items: center; }
        
        .btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: #21262d; color: var(--blue); cursor: pointer; font-weight: 600; text-decoration: none; font-size: 13px; text-align: center; }
        .btn-upload { background: var(--green); color: white; border: none; width: 100%; margin-top: 10px; }
        .btn-del { color: #f85149; border-color: rgba(248, 81, 73, 0.3); }

        #adminPanel { display: none; margin-bottom: 20px; padding: 15px; border: 1px solid var(--blue); border-radius: 10px; background: rgba(88, 166, 255, 0.05); }
        input[type="file"] { display: block; width: 100%; margin: 10px 0; color: #8b949e; font-size: 14px; }
        
        #st { text-align: center; color: #8b949e; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <div>
        <h2 style="margin:0;">CloudNode</h2>
        <div id="badge" class="admin-badge">ROOT ACCESS</div>
    </div>
    <button class="btn" id="loginBtn" onclick="adminLogin()">ADMIN LOGIN</button>
</header>

<div id="adminPanel">
    <small style="color: var(--blue);">SYSTEM AUTHENTICATED: S25 ULTRA</small>
    <input type="file" id="filePicker">
    <button class="btn btn-upload" onclick="uploadToGithub()">↑ PUSH TO REPO</button>
</div>

<div id="fileList" class="file-list">
    <p id="st">Scanning storage...</p>
</div>

<script>
    // --- !! EDIT THESE TWO LINES !! ---
    const GITHUB_USER = 'YOUR_GITHUB_USERNAME'; 
    const GITHUB_REPO = 'YOUR_REPO_NAME';     
    const FILE_PATH = 'uploads'; 
    
    let ADMIN_TOKEN = "";

    function adminLogin() {
        if(ADMIN_TOKEN) {
            ADMIN_TOKEN = "";
            location.reload();
            return;
        }
        const pass = prompt("Paste GitHub Token (Classic):");
        if(pass) {
            ADMIN_TOKEN = pass.trim(); // Kills accidental mobile spaces
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('badge').style.display = 'inline-block';
            document.getElementById('loginBtn').innerText = "LOGOUT";
            loadFiles();
        }
    }

    async function loadFiles() {
        const list = document.getElementById('fileList');
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`);
            const files = await res.json();
            
            list.innerHTML = "";
            if(!Array.isArray(files)) { 
                list.innerHTML = "<p id='st'>No files found in /uploads folder.</p>"; 
                return; 
            }

            files.forEach(file => {
                if(file.name === ".gitkeep") return;
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <div>
                            <div style="font-weight:bold; font-size:15px; color:#fff;">${file.name}</div>
                            <small style="color:#8b949e">${(file.size / 1024).toFixed(1)} KB</small>
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <a href="${file.download_url}" class="btn" download>DOWNLOAD</a>
                        ${ADMIN_TOKEN ? `<button class="btn btn-del" onclick="deleteFile('${file.path}', '${file.sha}')">DELETE</button>` : ''}
                    </div>
                `;
                list.appendChild(item);
            });
        } catch (e) {
            list.innerHTML = "<p id='st'>Error connecting to GitHub.</p>";
        }
    }

    async function uploadToGithub() {
        const picker = document.getElementById('filePicker');
        if(!picker.files[0]) return alert("Please select a file first.");
        if(!ADMIN_TOKEN) return alert("Admin session expired.");
        
        const file = picker.files[0];
        const reader = new FileReader();
        
        // Show status
        const upBtn = document.querySelector('.btn-upload');
        upBtn.innerText = "UPLOADING...";
        upBtn.disabled = true;

        reader.onload = async function() {
            const content = reader.result.split(',')[1];
            const endpoint = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}/${file.name}`;
            
            try {
                const res = await fetch(endpoint, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${ADMIN_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        message: `S25U Admin Upload: ${file.name}`,
                        content: content
                    })
                });

                const debug = await res.json();

                if(res.ok) { 
                    alert("SUCCESS: File is now live."); 
                    picker.value = "";
                    loadFiles(); 
                } else { 
                    alert("GITHUB ERROR: " + (debug.message || "Unknown error")); 
                }
            } catch (err) {
                alert("NETWORK ERROR: Check InviZible Pro or Firewall.");
            } finally {
                upBtn.innerText = "↑ PUSH TO REPO";
                upBtn.disabled = false;
            }
        };
        reader.readAsDataURL(file);
    }

    async function deleteFile(path, sha) {
        if(!confirm("Permanently delete this file from the cloud?")) return;
        
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
                method: 'DELETE',
                headers: { 
                    'Authorization': `Bearer ${ADMIN_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ 
                    message: "S25U Admin Delete", 
                    sha: sha 
                })
            });

            if(res.ok) {
                loadFiles();
            } else {
                const debug = await res.json();
                alert("DELETE FAILED: " + debug.message);
            }
        } catch (err) {
            alert("Network error during deletion.");
        }
    }

    loadFiles();
</script>

</body>
</html>
