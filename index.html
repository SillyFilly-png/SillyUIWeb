<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNode Admin</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --blue: #58a6ff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .admin-badge { font-size: 10px; background: #238636; color: white; padding: 2px 8px; border-radius: 10px; display: none; }

        .file-list { margin-top: 20px; display: grid; gap: 10px; }
        .file-item { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: #21262d; color: var(--blue); cursor: pointer; font-weight: 600; text-decoration: none; font-size: 13px; }
        .btn-upload { background: #238636; color: white; border: none; }
        .btn-del { color: #f85149; }

        #adminPanel { display: none; margin-top: 15px; padding: 15px; border: 1px solid var(--blue); border-radius: 8px; background: #0d1117; }
        input[type="file"] { margin: 10px 0; color: #8b949e; }
    </style>
</head>
<body>

<header>
    <div>
        <h2 style="margin:0;">CloudNode</h2>
        <div id="badge" class="admin-badge">ADMIN ACTIVE</div>
    </div>
    <button class="btn" id="loginBtn" onclick="adminLogin()">ADMIN LOGIN</button>
</header>

<div id="adminPanel">
    <small>Logged in as Root. Select file to push to GitHub:</small><br>
    <input type="file" id="filePicker">
    <button class="btn btn-upload" onclick="uploadToGithub()">PUSH TO CLOUD</button>
</div>

<div id="fileList" class="file-list">
    <p style="text-align:center; color:#8b949e;">Fetching shared files...</p>
</div>

<script>
    // --- CONFIGURATION ---
    const GITHUB_USER = 'YOUR_GITHUB_USERNAME'; // REPLACE THIS
    const GITHUB_REPO = 'YOUR_REPO_NAME';     // REPLACE THIS
    const FILE_PATH = 'uploads';               // Folder in your repo
    let ADMIN_TOKEN = "";

    function adminLogin() {
        const pass = prompt("Enter Admin Access Token:");
        if(pass) {
            ADMIN_TOKEN = pass;
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('badge').style.display = 'inline-block';
            document.getElementById('loginBtn').innerText = "LOGOUT";
        }
    }

    async function loadFiles() {
        const list = document.getElementById('fileList');
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`);
            const files = await res.json();
            
            list.innerHTML = "";
            if(!Array.isArray(files)) { list.innerHTML = "<p>No files shared yet.</p>"; return; }

            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">${file.name}</div>
                        <small style="color:#8b949e">${(file.size / 1024).toFixed(1)} KB</small>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <a href="${file.download_url}" class="btn" download>DOWNLOAD</a>
                        ${ADMIN_TOKEN ? `<button class="btn btn-del" onclick="deleteFile('${file.path}', '${file.sha}')">DELETE</button>` : ''}
                    </div>
                `;
                list.appendChild(item);
            });
        } catch (e) {
            list.innerHTML = "<p>Error loading cloud storage.</p>";
        }
    }

    async function uploadToGithub() {
        const picker = document.getElementById('filePicker');
        if(!picker.files[0]) return alert("Select a file first");
        
        const file = picker.files[0];
        const reader = new FileReader();
        
        reader.onload = async function() {
            const content = reader.result.split(',')[1]; // Base64 part
            const endpoint = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}/${file.name}`;
            
            const res = await fetch(endpoint, {
                method: 'PUT',
                headers: { 'Authorization': `token ${ADMIN_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Admin upload: ${file.name}`,
                    content: content
                })
            });

            if(res.ok) { alert("Upload Successful!"); loadFiles(); }
            else { alert("Upload Failed. Check Token."); }
        };
        reader.readAsDataURL(file);
    }

    async function deleteFile(path, sha) {
        if(!confirm("Permanently delete from cloud?")) return;
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
            method: 'DELETE',
            headers: { 'Authorization': `token ${ADMIN_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Admin delete", sha: sha })
        });
        if(res.ok) loadFiles();
    }

    loadFiles();
</script>

</body>
</html>
